name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # There are no dependencies to install — the app and its tests are
      # dependency-free by design, so there is no lockfile and no npm ci step.
      - name: Show environment
        run: node --version

      - name: Run the test suite
        run: node --test tests/*.test.js

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Every module parses as an ES module
        run: |
          set -e
          for f in src/core/*.js src/ui/*.js scripts/*.js sw.js; do
            node --check "$f"
          done
          echo "All modules parse."

      - name: Core stays free of DOM globals
        run: |
          set -e
          # store.js, share.js and qr.js are the documented exceptions: they own
          # persistence, the compression streams, and canvas rendering.
          offenders=$(grep -lE '\b(document|window|localStorage)\b' src/core/*.js \
            | grep -vE 'src/core/(store|share|qr)\.js' || true)
          if [ -n "$offenders" ]; then
            echo "These core modules must stay pure but touch the DOM:"
            echo "$offenders"
            exit 1
          fi
          echo "src/core/ is clean."

      - name: Relative imports carry a .js extension
        run: |
          set -e
          bad=$(grep -rnE "from '\.\.?/[^']*'" src/ \
            | grep -vE "\.js'" || true)
          if [ -n "$bad" ]; then
            echo "Extensionless relative imports break in the browser:"
            echo "$bad"
            exit 1
          fi
          echo "All relative imports are explicit."
